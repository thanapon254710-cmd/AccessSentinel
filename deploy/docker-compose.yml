# AccessSentinel local development stack (Phase 2: infrastructure).
#
# From the repository root, after `copy .env.example .env` and setting the passwords:
#   docker compose up -d --build          # COMPOSE_FILE in .env points here
#   docker compose run --rm tools python scripts/check_infra.py
#   docker compose down                   # keeps data volumes;  `down -v` deletes them
#
# Memory budget: ~3.5 GB for this file (see docs/SETUP_WINDOWS.md).
# Services reach each other by service name on the `accesssentinel` network; the host reaches
# Kafka on localhost:9092, Postgres on localhost:5432, Redis on localhost:6379, the HDFS UI on :9870.

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: accesssentinel/app:dev
  env_file: [../.env]
  environment: &app-env           # in-network endpoints override the host values from .env
    AS_KAFKA_BOOTSTRAP: kafka:29092
    AS_HDFS_URL: http://namenode:9870
    AS_POSTGRES_HOST: postgres
    AS_POSTGRES_PORT: "5432"
    AS_REDIS_HOST: redis
    AS_REDIS_PORT: "6379"
    AS_MODEL_DIR: /app/models
  networks: [accesssentinel]

services:
  # ---------------------------------------------------------------- Apache Kafka (KRaft, 1 node)
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics come only from accesssentinel/topics.py
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes: [kafka-data:/var/lib/kafka/data]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 20s
    networks: [accesssentinel]

  kafka-init:                       # idempotent topic provisioning from accesssentinel/topics.py
    <<: *app
    command: ["python", "-m", "accesssentinel.provision"]
    restart: "no"
    depends_on:
      kafka: {condition: service_healthy}

  # ---------------------------------------------------------------- Apache Hadoop HDFS (1 NN + 1 DN)
  namenode:
    image: apache/hadoop:3.4.1
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports: ["9870:9870"]            # NameNode UI + WebHDFS
    env_file: [./hadoop.env]
    environment:
      ENSURE_NAMENODE_DIR: /data/name   # formats the NameNode on first start only
    volumes: [hdfs-name:/data]        # image's starter.sh makes /data writable for the hadoop user
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9870/webhdfs/v1/?op=GETFILESTATUS' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [accesssentinel]

  datanode:
    image: apache/hadoop:3.4.1
    hostname: datanode
    command: ["hdfs", "datanode"]
    ports: ["9864:9864"]            # WebHDFS data transfer (redirect target)
    env_file: [./hadoop.env]
    volumes: [hdfs-data:/data]
    mem_limit: 768m
    depends_on:
      namenode: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9864/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [accesssentinel]

  # ---------------------------------------------------------------- PostgreSQL (operational state)
  postgres:
    image: postgres:16.4-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: ${AS_POSTGRES_DB:-accesssentinel}
      POSTGRES_USER: ${AS_POSTGRES_USER:-accesssentinel}
      POSTGRES_PASSWORD: ${AS_POSTGRES_PASSWORD:?Set AS_POSTGRES_PASSWORD in .env}
    volumes: [pg-data:/var/lib/postgresql/data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [accesssentinel]

  # ---------------------------------------------------------------- Redis (shared state, decision cache)
  redis:
    image: redis:7.4.1-alpine
    ports: ["6379:6379"]
    environment:
      REDISCLI_AUTH: ${AS_REDIS_PASSWORD:?Set AS_REDIS_PASSWORD in .env}
    # noeviction: monitoring state must never be dropped silently when memory is full.
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass \"$$REDISCLI_AUTH\""]
    volumes: [redis-data:/data]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [accesssentinel]

  # ---------------------------------------------------------------- schema + demo catalog (Phase 3)
  db-init:                          # idempotent: creates tables, upserts the demo catalog and users
    <<: *app
    command: ["python", "-m", "accesssentinel.db.init_db", "--seed-demo"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  # ---------------------------------------------------------------- protected demo applications
  # No host ports: reachable only through the gateway on the internal network, and only with the
  # gateway's upstream token. Least privilege: the apps receive only that token, not the rest of .env.
  app-hr: &demo-app
    <<: *app
    env_file: []
    environment: &demo-env
      AS_APP_ID: hr
      AS_UPSTREAM_TOKEN: ${AS_UPSTREAM_TOKEN:?Set AS_UPSTREAM_TOKEN in .env}
      AS_LOG_LEVEL: ${AS_LOG_LEVEL:-INFO}
    command: ["uvicorn", "--factory", "accesssentinel.services.demo_app:build", "--host", "0.0.0.0",
              "--port", "8000", "--no-access-log"]
    mem_limit: 256m
    healthcheck: &py-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  app-finance:
    <<: *demo-app
    environment: {<<: *demo-env, AS_APP_ID: finance}

  app-docs:
    <<: *demo-app
    environment: {<<: *demo-env, AS_APP_ID: docs}

  # ---------------------------------------------------------------- Proxy / Access-Control Gateway
  gateway:
    <<: *app
    command: ["uvicorn", "--factory", "accesssentinel.services.gateway.main:build", "--host", "0.0.0.0",
              "--port", "8000", "--no-access-log"]
    ports: ["8000:8000"]
    volumes: [gateway-spool:/app/accesssentinel_data/spool]
    mem_limit: 384m
    healthcheck: *py-health
    depends_on:
      db-init: {condition: service_completed_successfully}
      kafka-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      app-hr: {condition: service_healthy}
      app-finance: {condition: service_healthy}
      app-docs: {condition: service_healthy}

  # ---------------------------------------------------------------- stream processing (Phase 4)
  repartitioner:                    # access-events (key=user) -> access-events-by-resource (key=app:res#bucket)
    <<: *app
    command: ["python", "-m", "accesssentinel.streaming.repartitioner"]
    mem_limit: 256m
    healthcheck: &stream-health
      test: ["CMD", "python", "-m", "accesssentinel.streaming.runtime"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    depends_on:
      kafka-init: {condition: service_completed_successfully}

  hdfs-sink:                        # storage path: independent consumer group -> HDFS Parquet history
    <<: *app
    command: ["python", "-m", "accesssentinel.streaming.hdfs_sink"]
    environment:
      <<: *app-env
      AS_SINK_FLUSH_ROWS: ${AS_SINK_FLUSH_ROWS:-2000}
      AS_SINK_FLUSH_SECONDS: ${AS_SINK_FLUSH_SECONDS:-30}
      AS_FAULT_INJECT: ${AS_FAULT_INJECT:-}          # crash-consistency experiments only; ignored in prod
    mem_limit: 384m
    healthcheck: *stream-health
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      datanode: {condition: service_healthy}
      redis: {condition: service_healthy}

  # ---------------------------------------------------------------- individual detection (Phase 5)
  tcn-worker:                       # stateless TCN scorers; Kafka splits user partitions between replicas
    <<: *app
    command: ["python", "-m", "accesssentinel.streaming.tcn_worker"]
    environment:
      <<: *app-env
      AS_TCN_RECHECK_SECONDS: ${AS_TCN_RECHECK_SECONDS:-}     # empty = D3 default (600 s)
      AS_TCN_LIVE_WINDOW_SECONDS: ${AS_TCN_LIVE_WINDOW_SECONDS:-}  # empty = 3600 s
    volumes: [../models:/app/models:ro]                     # trained registry (accesssentinel.ml.train_tcn)
    deploy:
      replicas: ${AS_TCN_WORKERS:-2}
    mem_limit: 768m
    healthcheck: *stream-health
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  # ---------------------------------------------------------------- four-path escalation (Phase 6)
  escalation:                       # Paths A-D -> escalations.realtime / escalations.background (for the TGN)
    <<: *app
    command: ["python", "-m", "accesssentinel.streaming.escalation_service"]
    environment:
      <<: *app-env
      AS_ESC_GAMMA: ${AS_ESC_GAMMA:-}                     # empty = D3 initial values (EscalationConfig)
      AS_ESC_KAPPA: ${AS_ESC_KAPPA:-}
      AS_ESC_T_SWEEP: ${AS_ESC_T_SWEEP:-}
      AS_ESC_ANALYSIS_WINDOW: ${AS_ESC_ANALYSIS_WINDOW:-}
    mem_limit: 384m
    healthcheck: *stream-health
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      datanode: {condition: service_healthy}

  # ---------------------------------------------------------------- one-off tooling container
  tools:
    <<: *app
    profiles: [tools]               # not started by `up`; use `docker compose run --rm tools ...`
    volumes: [../models:/app/models:ro]
    command: ["python", "scripts/check_infra.py"]
    depends_on:
      kafka: {condition: service_healthy}
      namenode: {condition: service_healthy}
      datanode: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  kafka-data:
  hdfs-name:
  hdfs-data:
  pg-data:
  redis-data:
  gateway-spool:

networks:
  accesssentinel:
    name: accesssentinel
